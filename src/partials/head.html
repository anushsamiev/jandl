<script>
/* Always open pages at the top (unless the link targets a #section). */
(function () {
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  function top () { if (!location.hash) window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); }
  top();
  document.addEventListener('DOMContentLoaded', top);
  window.addEventListener('load', top);
  window.addEventListener('pageshow', function (e) { if (e.persisted) top(); });
})();
</script>
